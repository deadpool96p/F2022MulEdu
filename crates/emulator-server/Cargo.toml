[package]
name = "emulator-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Main executable binary running FIFA 22 Blaze Emulator and Services"

[dependencies]
blaze-core = { path = "../blaze-core" }
blaze-tdf = { path = "../blaze-tdf" }
services-redirector = { path = "../services-redirector" }
services-blaze = { path = "../services-blaze" }
services-http-content = { path = "../services-http-content" }
services-qos-relay = { path = "../services-qos-relay" }

tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
