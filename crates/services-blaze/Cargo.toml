[package]
name = "services-blaze"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Core Blaze RPC services: Util, Authentication, and UserSessions"

[dependencies]
blaze-core = { path = "../blaze-core" }
blaze-tdf = { path = "../blaze-tdf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
