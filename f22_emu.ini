; FIFA 22 Multiplayer Emulator Shim Configuration
; Place this file in the game directory alongside dxgi.dll and FIFA22.exe

[Network]
; Target emulator host (use 127.0.0.1 for local server, or LAN/WAN IP for remote)
ServerIp = 127.0.0.1
EmulatorHost = 127.0.0.1

; Blaze Redirector service port (FIFA 22 standard port: 42230, legacy: 42127)
RedirectorPort = 42230

; Core Blaze RPC server port
BlazePort = 42128

; Telemetry HTTP/HTTPS sink port
TelemetryPort = 443

; Reroute all *.ea.com, *.ea.net, *.dice.se domains to EmulatorHost (false = only gosredirector and blaze)
RerouteAllEA = true

; Downgrade connection to plain TCP if true (0 = TLS enabled matching standardSecure_v4)
ForcePlainTCP = 0

; In-game overlay toggle (F1 key)
EnableOverlay = 1

; Log socket connect/lookup events to f22_shim.log
LogSockets = true

[SSL]
; Automatically accept self-signed certificates for local HTTPS and Blaze TLS
BypassCertValidation = true

[Steam]
; Enable Steamworks integration (AppID 480 / Spacewar)
EnableSteam = 1
SteamAppId = 480
